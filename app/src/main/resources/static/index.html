<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smart Clinic | Select Role</title>

    <link rel="icon" type="image/png" href="./assets/images/logo/Logo.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/index.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- Utility / Render Scripts -->
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>

    <!-- Components -->
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
</head>

<body>
<div class="container">
    <div class="wrapper">
        <!-- Header placeholder -->
        <div id="header"></div>

        <!-- Main content -->
        <main class="main-content" id="mainContent">
            <section class="role-selection" id="roleSelection">
                <h2 id="roleHeading">Select Your Role</h2>

                <div class="role-buttons" id="roleButtons">
                    <button
                            id="adminBtn"
                            type="button"
                            onclick="selectRole('admin')"
                    >
                        Admin
                    </button>

                    <button
                            id="doctorBtn"
                            type="button"
                            onclick="selectRole('doctor')"
                    >
                        Doctor
                    </button>

                    <button
                            id="patientBtn"
                            type="button"
                            onclick="selectRole('patient')"
                    >
                        Patient
                    </button>
                </div>
            </section>
        </main>

        <!-- Footer placeholder -->
        <div id="footer"></div>
    </div>
</div>

<!-- Hidden Modal -->
<div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content" id="modalContent">
        <button id="closeModal" class="close-btn" type="button" aria-label="Close modal">
            &times;
        </button>

        <div id="modal-body">
            <!-- Dynamic modal content will be injected here -->
        </div>
    </div>
</div>

<!-- Page-specific service -->
<script type="module" src="./js/services/index.js" defer></script>
</body>
</html>
