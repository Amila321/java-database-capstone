<!-- doctorDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoctorDashboard</title>

    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" />

    <!-- Utility Scripts -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <!-- Components -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>

    <!-- Main Logic -->
    <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</head>

<body>
<div class="container">
    <div class="wrapper">
        <!-- Header placeholder -->
        <div id="header"></div>

        <!-- Main dashboard content -->
        <main class="main-content doctor-dashboard" id="doctorDashboard">
            <section class="dashboard-header" id="dashboardHeader">
                <h2 id="dashboardTitle">Doctor Dashboard</h2>
                <p id="dashboardSubtitle">Manage patient records and track appointments efficiently.</p>
            </section>

            <section class="dashboard-controls" id="dashboardControls">
                <div class="search-section" id="searchSection">
                    <label for="searchBar" class="visually-hidden">Search patients</label>
                    <input
                            type="text"
                            id="searchBar"
                            class="searchBar"
                            placeholder="Search by patient name, phone, or email"
                    />
                </div>

                <div class="filter-section" id="filterSection">
                    <button id="todayButton" class="dashboard-btn" type="button">
                        Today's Appointments
                    </button>

                    <label for="datePicker" class="visually-hidden">Select appointment date</label>
                    <input type="date" id="datePicker" class="input-field" />
                </div>
            </section>

            <section class="table-section" id="tableSection">
                <table id="patientTable" class="patient-table">
                    <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Prescription</th>
                    </tr>
                    </thead>
                    <tbody id="patientTableBody">
                    <!-- Dynamic patient rows will be injected here -->
                    </tbody>
                </table>
            </section>
        </main>

        <!-- Footer placeholder -->
        <div id="footer"></div>
    </div>
</div>
</body>
</html>
